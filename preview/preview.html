var TPL_FRONT = "<link rel=\"stylesheet\" href=\"_hna_styles_v7.css\">\r\n\r\n<!-- Đáp án ẩn phục vụ Realtime Checker -->\r\n<span id=\"correct-answer\" aria-hidden=\"true\">{{word}}<\/span>\r\n\r\n<!-- Settings menu markup is NOT here anymore. It used to be a ~99-line\r\n     <template id=\"settings-template\"> duplicated verbatim in this file and in\r\n     Back.html, so every menu change had to be made twice by hand or the two\r\n     faces drifted. It now has one definition: AnkiEngine.MENU_SPEC in\r\n     _hna_engine.js, built lazily into #settingsMenu on first gear click. -->\r\n\r\n<!-- Nút Cài đặt & Menu -->\r\n<button type=\"button\" id=\"btnSettings\" class=\"btn-settings\" onclick=\"AnkiEngine.toggleSettings(event)\" aria-label=\"Inställningar\">\r\n    <div class=\"settings-cross\"><\/div>\r\n<\/button>\r\n<div id=\"settingsMenu\" class=\"settings-menu\"><\/div>\r\n\r\n<div class=\"card-wrapper\">\r\n    <div class=\"aurora-card card-front\">\r\n        <!-- Layer 1: Animated aurora background — moved out to a\r\n             session-persistent singleton, see _hna_aurora.js. Nothing\r\n             here anymore on purpose (no leftover .aurora-bg div). -->\r\n\r\n        <!-- Layer 3: Pseudo glass on .cue-card::before/::after -->\r\n        <div class=\"card-content\">\r\n            <!-- Khung Gợi ý Mặt trước (Cue Card) — meaning→word mode -->\r\n            <div class=\"cue-card glass-pseudo cue-card--meaning\">\r\n                <div class=\"prompt-label\">Mening<\/div>\r\n                {{#meaning}}<span class=\"prompt-content\">{{meaning}}<\/span>{{/meaning}}\r\n                <div class=\"meaning-row\">\r\n                    {{#pos}}<span class=\"pos-badge\">{{pos}}<\/span>{{/pos}}\r\n                    {{#audio_meaning}}<span class=\"sound\">{{audio_meaning}}<\/span>{{/audio_meaning}}\r\n                <\/div>\r\n                {{#explain}}\r\n                <details class=\"hint-reveal\">\r\n                    <summary class=\"hint-reveal-trigger\">Mer förklaring<\/summary>\r\n                    <div class=\"giaithich\">{{explain}}<\/div>\r\n                <\/details>\r\n                {{/explain}}\r\n            <\/div>\r\n\r\n            <!-- Ô nhập từ Option A: Khung gõ tích hợp Nút Hint làm Suffix -->\r\n            <div class=\"typing-area\">\r\n                <div class=\"type-input-wrapper glass-pseudo\">\r\n                    {{type:word}}\r\n                    <div id=\"typeans-overlay\"><\/div>\r\n                    <div id=\"smooth-caret\"><\/div>\r\n                <\/div>\r\n            <\/div>\r\n\r\n            <!-- Footer Toolbar -->\r\n            <div class=\"footer-toolbar\">\r\n                <div class=\"card-tags glass-pseudo\">\r\n                    {{#tag_1}}<span class=\"tag-badge\" title=\"{{tag_1}}\">{{tag_1}}<\/span>{{/tag_1}}\r\n                    {{#tag_2}}<span class=\"tag-badge\" title=\"{{tag_2}}\">{{tag_2}}<\/span>{{/tag_2}}\r\n                    {{#tag_3}}<span class=\"tag-badge\" title=\"{{tag_3}}\">{{tag_3}}<\/span>{{/tag_3}}\r\n                    {{#tag_4}}<span class=\"tag-badge\" title=\"{{tag_4}}\">{{tag_4}}<\/span>{{/tag_4}}\r\n                    {{#ID}}<span class=\"tag-badge id-badge\" title=\"{{ID}}\">ID: {{ID}}<\/span>{{/ID}}\r\n                <\/div>\r\n                <div class=\"stats-footer\">HNA • ID {{ID}} • {{Tags}}<\/div>\r\n            <\/div>\r\n        <\/div>\r\n    <\/div>\r\n<\/div>\r\n\r\n<script src=\"_hna_storage.js\"><\/script>\r\n<!-- _hna_engine.js must precede _hna_diff.js / _hna_typing.js: both call\r\n     AnkiEngine.decodeHTML at load time. -->\r\n<script src=\"_hna_engine.js\"><\/script>\r\n<script src=\"_hna_diff.js\"><\/script>\r\n<script src=\"_hna_typing.js\"><\/script>\r\n<!-- Independent of the modules above — creates/repositions the aurora\r\n     singleton in <body>, outside the region Anki swaps each card. -->\r\n<script src=\"_hna_aurora.js\"><\/script>\r\n<script>\r\n(function() {\r\n    var det = document.querySelector('.hint-reveal');\r\n    if (!det) return;\r\n    var gi = det.querySelector('.giaithich');\r\n    // Tag-aware emptiness: {{explain}} may contain an <img>; an <img>-only\r\n    // node has whitespace textContent, so hide only when there is no media\r\n    // child AND no non-whitespace text.\r\n    if (!gi || (!gi.querySelector('img,audio,video') && !gi.textContent.trim())) {\r\n        det.style.display = 'none';\r\n    }\r\n})();\r\n<\/script>\r\n";
var TPL_BACK = "<link rel=\"stylesheet\" href=\"_hna_styles_v7.css\">\r\n\r\n<!-- Đáp án ẩn phục vụ tính toán Visual Diff -->\r\n<span id=\"correct-answer\" aria-hidden=\"true\">{{word}}<\/span>\r\n\r\n<!-- Settings menu markup is NOT here anymore. It used to be a ~99-line\r\n     <template id=\"settings-template\"> duplicated verbatim in this file and in\r\n     Front.html, so every menu change had to be made twice by hand or the two\r\n     faces drifted. It now has one definition: AnkiEngine.MENU_SPEC in\r\n     _hna_engine.js, built lazily into #settingsMenu on first gear click. -->\r\n\r\n<!-- Nút Cài đặt & Menu (Cố định góc trên bên phải) -->\r\n<button id=\"btnSettings\" type=\"button\" class=\"btn-settings\" aria-label=\"Inställningar\" onclick=\"AnkiEngine.toggleSettings(event)\">\r\n    <div class=\"settings-cross\"><\/div>\r\n<\/button>\r\n<div id=\"settingsMenu\" class=\"settings-menu\"><\/div>\r\n\r\n<div class=\"card-wrapper\">\r\n    <div class=\"aurora-card card-back\">\r\n        <!-- Layer 1: Animated aurora background — moved out to a\r\n             session-persistent singleton, see _hna_aurora.js. Nothing\r\n             here anymore on purpose (no leftover .aurora-bg div). -->\r\n\r\n        <!-- Layer 3: Pseudo glass on .recall-card::before/::after -->\r\n        <div class=\"card-content\">\r\n\r\n            <!-- Khu vực Recall Card (Thông tin chi tiết từ vựng) — progressive reveal -->\r\n            <div class=\"recall-card glass-pseudo\">\r\n                <!-- §1: HEADWORD — the hero, appears immediately.\r\n                     Anchored metadata: pos-badge / IPA / audio live in their own\r\n                     row BELOW the word, so a long word or phrase can never\r\n                     displace them (they are grammatical pre-training cues that\r\n                     must stay visible — BUG-025). -->\r\n                <div class=\"back-section back-section--word\">\r\n                    <span class=\"swedish-word\">{{word}}<\/span>\r\n                    <div class=\"word-meta\">\r\n                        {{#pos}}<span class=\"pos-badge\">{{pos}}<\/span>{{/pos}}\r\n                        {{#transliteration}}<span class=\"ipa\" data-pron=\"{{transliteration}}\">[{{transliteration}}]<\/span>{{/transliteration}}\r\n                        {{#audio_word}}<span class=\"sound\">{{audio_word}}<\/span>{{/audio_word}}\r\n                    <\/div>\r\n                <\/div>\r\n\r\n                <!-- §2: CONTEXT — example + image, fades in after word -->\r\n                <div class=\"back-section back-section--context\">\r\n                    {{#image}}\r\n                    <div class=\"recall-thumb\">\r\n                        {{image}}\r\n                    <\/div>\r\n                    {{/image}}\r\n                    {{#example}}\r\n                    <details class=\"example-box example-dropdown expand-container\" id=\"example-dropdown\" open>\r\n                        <summary class=\"expand-trigger example-trigger\">\r\n                            <span class=\"example-title-row\">Exempel{{#audio_example}}<span class=\"sound example-sound\">{{audio_example}}<\/span>{{/audio_example}}<\/span>\r\n                            <span class=\"expand-chevron\"><\/span>\r\n                        <\/summary>\r\n                        <div class=\"expand-content example-copy glass-pseudo\">\r\n                            <div class=\"ex-text\">\r\n                                <span>{{example}}<\/span>\r\n                            <\/div>\r\n                            {{#example_translated}}<div class=\"ex-trans\">{{example_translated}}<\/div>{{/example_translated}}\r\n                        <\/div>\r\n                    <\/details>\r\n                    {{/example}}\r\n                <\/div>\r\n\r\n                <!-- §3: EXTRA INFORMATION — opens by default. The explain\r\n                     paragraph leads (it answers \"why is this word used\r\n                     here?\"), then forms / synonyms / antonyms follow. -->\r\n                <div class=\"back-section back-section--expand\">\r\n                    <details class=\"expand-container\" id=\"expand-info-details\" open>\r\n                        <summary class=\"expand-trigger\">Extra information <span class=\"expand-chevron\"><\/span><\/summary>\r\n                        <div class=\"expand-content glass-pseudo\">\r\n                            {{#explain}}<div class=\"giaithich\">{{explain}}<\/div>{{/explain}}\r\n                            {{#forms}}\r\n                            <div class=\"row-info\"><span class=\"label\">Böjningsformer<\/span> <span class=\"val\">{{forms}}<\/span><\/div>\r\n                            {{/forms}}\r\n                            {{#synonym}}\r\n                            <div class=\"row-info\"><span class=\"label\">Synonymer<\/span> <span class=\"val\">{{synonym}}<\/span><\/div>\r\n                            {{/synonym}}\r\n                            {{#antonym}}\r\n                            <div class=\"row-info\"><span class=\"label\">Antonymer<\/span> <span class=\"val\">{{antonym}}<\/span><\/div>\r\n                            {{/antonym}}\r\n                        <\/div>\r\n                    <\/details>\r\n                <\/div>\r\n            <\/div>\r\n\r\n            <!-- Khu vực Phản hồi Visual Diff & Verdict — sits below the word -->\r\n            <div id=\"visual-diff-container\" class=\"verdict-card\" role=\"status\" aria-live=\"polite\" aria-atomic=\"true\">\r\n                <div id=\"diff-section-correct\" class=\"diff-section\">\r\n                    <div class=\"diff-row-label\">Det korrekta svaret<\/div>\r\n                    <div id=\"diff-correct-row\" class=\"diff-row diff-row-correct\"><\/div>\r\n                <\/div>\r\n                <div id=\"diff-section-input\" class=\"diff-section\">\r\n                    <div class=\"diff-row-label\">Ditt svar<\/div>\r\n                    <div id=\"diff-input-row\" class=\"diff-row diff-row-typed\"><\/div>\r\n                <\/div>\r\n            <\/div>\r\n\r\n            <script>\r\n                (function() {\r\n                    var det = document.getElementById('expand-info-details');\r\n                    if (det) {\r\n                        var content = det.querySelector('.expand-content');\r\n                        if (!content || !content.textContent.trim()) {\r\n                            det.style.display = 'none';\r\n                        }\r\n                        // The Back face is long on phones, so keep Extra\r\n                        // information collapsed by default there. Desktop keeps\r\n                        // the section open (the explain paragraph leads).\r\n                        if (typeof window.matchMedia === 'function' &&\r\n                            window.matchMedia('(max-width: 768px)').matches) {\r\n                            det.removeAttribute('open');\r\n                        }\r\n                    }\r\n\r\n                    // Tag-aware emptiness: {{image}} renders an <img>-only node\r\n                    // whose textContent is whitespace, so textContent.trim()\r\n                    // alone hid real image cards. Hide only when there is no\r\n                    // media child AND no non-whitespace text.\r\n                    var thumb = document.querySelector('.recall-thumb');\r\n                    if (thumb && !thumb.querySelector('img,audio,video') && !thumb.textContent.trim()) {\r\n                        thumb.style.display = 'none';\r\n                    }\r\n\r\n                    // Same predicate: {{example}} may embed an image or audio.\r\n                    // The example is now a disclosure whose play button lives in\r\n                    // the title row: check the copy panel (not the whole box) so\r\n                    // the static \"Exempel\" label does not keep an empty example\r\n                    // alive, while a title-row sound still keeps it visible.\r\n                    var exBox = document.getElementById('example-dropdown');\r\n                    if (exBox) {\r\n                        var exContent = exBox.querySelector('.expand-content');\r\n                        var exHasMedia = exBox.querySelector('img,audio,video');\r\n                        if ((!exContent || !exContent.textContent.trim()) && !exHasMedia) {\r\n                            exBox.style.display = 'none';\r\n                        }\r\n                        // Exempel stays open by default on all widths.\r\n                        // The play-audio button sits inside <summary>, so clicking\r\n                        // it must play the sound WITHOUT toggling the disclosure.\r\n                        // preventDefault cancels the summary click's default\r\n                        // (toggling) without stopping propagation — Anki's own\r\n                        // replay handler (inline onclick or delegated) still runs.\r\n                        var exSummary = exBox.querySelector('summary');\r\n                        if (exSummary) {\r\n                            exSummary.addEventListener('click', function (e) {\r\n                                if (e.target && e.target.closest &&\r\n                                    e.target.closest('.sound, .replay-button, .soundLink')) {\r\n                                    e.preventDefault();\r\n                                }\r\n                            });\r\n                        }\r\n                    }\r\n                })();\r\n            <\/script>\r\n\r\n            <!-- Footer & Toolbar (Tags 1-4, ID) -->\r\n            <div class=\"footer-toolbar\">\r\n                <hr class=\"aurora-divider\">\r\n\r\n                <div class=\"card-tags glass-pseudo\">\r\n                    {{#tag_1}}<span class=\"tag-badge\" title=\"{{tag_1}}\">{{tag_1}}<\/span>{{/tag_1}}\r\n                    {{#tag_2}}<span class=\"tag-badge\" title=\"{{t   "storage": "/* ============================================================\r\n   HNA STORAGE MODULE\r\n   Cross-platform storage with localStorage + cookie fallback.\r\n   Used by both Typing and MCQ note types for configuration persistence.\r\n   \r\n   Exports: safeGet(), safeSet(), STORAGE_KEYS\r\n   \r\n   See ARCHITECTURE.md for system overview.\r\n   ============================================================ */\r\n\r\n// NOTE: an explicit `getAnimations().cancel()` teardown used to live here.\r\n// Measured over 80 real flips it cancelled nothing — the previous card's root is\r\n// always already detached, and Blink drops its animations without help\r\n// (staleAnims === 0 at every checkpoint). Removed: it also kept a detached card\r\n// root alive in __hnaPrevCardRoot between flips. The actual per-flip growth was\r\n// event listeners, not compositor layers.\r\n\r\n// Clear typing-overlay state from previous card (prevents stale globals)\r\nwindow.__hnaActiveTypeansInput = null;\r\nwindow.__hnaScheduleTypeansUpdate = null;\r\n\r\n// NOTE: AnkiAudio.close() used to run here on every flip. Closing + reopening an\r\n// AudioContext per card churns a device thread each time; one context reused for\r\n// the whole session is cheaper and Blink suspends it when idle anyway. The\r\n// context now persists on window.AnkiAudio across flips.\r\n\r\nvar STORAGE_KEYS = {\r\n    CONFIG:       'anki-card-config',\r\n    TYPED_ANSWER: 'hna-typed-answer'\r\n};\r\n\r\n// Learner answers are transient review state, never a durable preference.\r\n// This TTL is only a crash/reload fallback for the current review session.\r\nvar TRANSIENT_TTL_MS = 30 * 60 * 1000;\r\n\r\nfunction safeCookie() {\r\n    try { return document.cookie || \"\"; } catch (e) { return \"\"; }\r\n}\r\n\r\nfunction safeGet(key) {\r\n    try {\r\n        var v = localStorage.getItem(key);\r\n        if (v !== null) return v;\r\n    } catch (e) { }\r\n    try {\r\n        var eq = key + \"=\", ca = safeCo   "engine": "/* ============================================================\r\n   HNA MAIN ENGINE\r\n   Shared configuration, settings UI, and keyboard shortcuts\r\n   for both Typing and MCQ note types.\r\n   \r\n   Exports: window.AnkiEngine\r\n   Dependencies: STORAGE_KEYS, safeGet, safeSet\r\n   \r\n   See ARCHITECTURE.md for system overview.\r\n   ============================================================ */\r\n\r\nwindow.AnkiEngine = window.AnkiEngine || {};\r\nvar AnkiEngine = window.AnkiEngine;\r\n\r\n// One reused textarea instead of a fresh element per call. This runs on every\r\n// card (twice on Back) and the discarded elements were measurable retained nodes.\r\nAnkiEngine.decodeHTML = function (html) {\r\n    var txt = AnkiEngine.__decoder;\r\n    if (!txt) { txt = AnkiEngine.__decoder = document.createElement(\"textarea\"); }\r\n    txt.innerHTML = html;\r\n    return txt.value;\r\n};\r\n\r\n// Tokenize answers once for typing feedback. This deliberately\r\n// uses ES5-safe Latin ranges: older Anki WebViews cannot parse Unicode\r\n// property escapes, while Swedish letters are covered by the range.\r\nAnkiEngine.tokenizeAnswer = function (answer) {\r\n    var text = String(answer == null ? '' : answer);\r\n    var tokens = [];\r\n    var i = 0;\r\n    var start;\r\n    var ch;\r\n    var type;\r\n    function isWordChar(c) { return /[0-9A-Za-z\\u00C0-\\u024F]/.test(c); }\r\n    function push(textPart, tokenType, tokenStart, tokenEnd) {\r\n        var previous = tokens.length ? tokens[tokens.length - 1] : null;\r\n        // Punctuation belongs to its preceding word feedback unit (Hej!).\r\n        if (tokenType === 'punctuation' && previous && previous.type === 'word') {\r\n            previous.text += textPart;\r\n            previous.normalized += textPart.toLowerCase();\r\n            previous.end = tokenEnd;\r\n            return;\r\n        }\r\n        tokens.push({ text: textPart, normalized: textPart.toLowerCase(), start: tokenStart, end: tokenEnd, type: tokenType });\r\n    }\r\n    while (i < text.length) {\r\n        start = i;\r\n        ch = text.charAt(i);\r\n        if (isWordChar(ch)) {\r\n            while (i < text.length && isWordChar(text.charAt(i))) i++;\r\n            type = 'word';\r\n        } else if (ch === '\\r' || ch === '\\n') {\r\n            if (ch === '\\r' && text.charAt(i + 1) === '\\n') i++;\r\n            i++;\r\n            type = 'newline';\r\n        } else if (/\\s/.test(ch)) {\r\n            while (i < text.length && /\\s/.test(text.charAt(i)) && text.charAt(i) !== '\\r' && text.charAt(i) !== '\\n') i++;\r\n            type = 'separator';\r\n        } else {\r\n            while (i < text.length && !isWordChar(text.charAt(i)) && !/\\s/.test(text.charAt(i))) i++;\r\n            type = 'punctuation';\r\n        }\r\n        push(text.slice(start, i), type, start, i);\r\n    }\r\n    return tokens;\r\n};\r\n\r\n// Shared answer-field parser — the \".swedish-word logic\". {{word}} reaches\r\n// span.swedish-word as RAW HTML on the Back face, so a <br> in the note\r\n// field renders there as a REAL line break. Reading .textContent instead\r\n// silently deletes <br> (\"katt<br>hund\" -> \"katthund\"), which fused\r\n// multi-line answers into one run-on string in both the typing overlay and\r\n// the visual diff. Both now parse through here: <br> variants become \\n\r\n// BEFORE tag stripping, other tags are removed while entity-escaped literal\r\n// angle brackets in the text survive, entities then decode, and CRLF/nbsp\r\n// normalize to \\n/space. Callers own trim/collapse decisions.\r\nAnkiEngine.decodeAnswerField = function (html) {\r\n    var s = String(html == null ? '' : html)\r\n        .replace(/<br\\s*\\/?>/gi, '\\n')\r\n        .replace(/<[^>]*>/g, '');\r\n    s = AnkiEngine.decodeHTML(s);\r\n    return s.replace(/\\r\\n?/g, '\\n').replace(/\\u00A0/g, ' ');\r\n};\r\n\r\nvar defaultConfig = {\r\n    nightMode: false,\r\n    realtimeCheck: true,\r\n    showSmoothCaret: true,\r\n    showTrans: true,\r\n    showExample: true,\r\n    showExplain: true,\r\n    showExpand: true,\r\n    showImage: true,\r\n    showTags: true,\r\n    showStats: false,\r\n    playSound: true,\r\n    auroraFlow: true\r\n};\r\n\r\n// Settings menu spec — single source of truth for both card faces.\r\n// This used to be a ~99-line <template id=\"settings-template\"> duplicated\r\n// verbatim in Front.html AND Back.html. Two copies of the same markup, in\r\n// files that must be pasted separately into Anki's template editor, meant\r\n// every menu change had to be made twice by hand or the two faces silently\r\n// drifted apart. Defining it here means both faces load one definition.\r\n// Fields: config key, Swedish label, SVG path, optional keyboard shortcut.\r\n// `extra: true` puts the row inside the collapsed \"Mer\" section.\r\n//\r\n// It sits HERE, next to defaultConfig, and not down beside buildSettingsMenu:\r\n// updateSwitches iterates it, and init() (which calls updateSwitches) runs at\r\n// top level partway down this file. Declared after that call, MENU_SPEC was\r\n// still undefined when the first card read `.length`, which threw and aborted\r\n// the rest of this file's top-level execution — so window.AnkiAudio never got\r\n// assigned and _hna_diff.js then died on `AnkiAudio is not defined`, rendering\r\n// the diff rows empty. Same key set as defaultConfig; keep the two together.\r\nAnkiEngine.MENU_SPEC = [\r\n    { key: 'nightMode', label: 'Mörkt läge', shortcut: 'Alt+D', d: 'M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1-8.313-12.454z' },\r\n    { key: 'realtimeCheck', label: 'Realtidskontroll', d: 'M9 12l2 2 4-4m6 2a9 9 0 1 1-18 0 9 9 0 0 1 18 0z' },\r\n    { key: 'showSmoothCaret', label: 'Mjuk markör', d: 'M11 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-5m-1.414-9.414a2 2 0 1 1 2.828 2.828L11.828 15H9v-2.828l8.586-8.586z' },\r\n    { key: 'playSound', label: 'Ljudeffekter', d: 'M11 5L6 9H2v6h4l5 4V5z m4 2a5 \r\n    return [\r\n        ['night-mode', c.nightMode],\r\n        ['disable-realtime', !c.realtimeCheck],\r\n        ['stealth-mode', !c.realtimeCheck && c.showSmoothCaret],\r\n        ['hide-smooth-caret', !c.showSmoothCaret],\r\n        ['hide-trans', !c.showTrans],\r\n        ['hide-example', !c.showExample],\r\n        ['hide-explain', !c.showExplain],\r\n        ['hide-expand', !c.showExpand],\r\n        ['hide-image', !c.showImage],\r\n        ['hide-tags-card', !c.showTags],\r\n        ['hide-stats', !c.showStats],\r\n        ['pause-aurora-flow', !c.auroraFlow]\r\n    ];\r\n};\r\n\r\nAnkiEngine._applyToggleMap = function (toggleMap) {\r\n    var cl = document.documentElement.classList;\r\n    for (var i = 0; i < toggleMap.length; i++) {\r\n        cl.toggle(toggleMap[i][0], toggleMap[i][1]);\r\n    }\r\n    var body = document.body;\r\n    if (body) body.classList.toggle('night-mode', this.config.nightMode);\r\n};\r\n\r\n// Drives off MENU_SPEC rather than a hand-kept short-name map (Night ->\r\n// nightMode, SmoothCaret -> showSmoothCaret, ...). That map was a third place\r\n// the 13 toggles were listed, after the two HTML templates, and adding a\r\n// setting meant editing all three or the switch silently never lit up.\r\nAnkiEngine.updateSwitches = function () {\r\n    for (var i = 0; i < this.MENU_SPEC.length; i++) {\r\n        var key = this.MENU_SPEC[i].key;\r\n        var el = document.getElementById('sw_' + key);\r\n        if (el) {\r\n            var on = Boolean(this.config[key]);\r\n            el.classList.toggle(\"checked\", on);\r\n            el.setAttribute('aria-checked', on ? 'true' : 'false');\r\n        }\r\n    }\r\n};\r\n\r\nAnkiEngine.toggleConfig = function (k) {\r\n    this.loadConfig();\r\n    this.config[k] = !this.config[k];\r\n    this.saveConfig();\r\n    this.applyConfig();\r\n};\r\n\r\nAnkiEngine.toggleSettings = function (e) {\r\n    if (e) e.stopPropagation();\r\n    this.buildSettingsMenu();\r\n    var btn = document.ge // Sample note fields (mimics what Anki injects at render time).
var SAMPLE = {
  word: 'en liten katt som heter Misse och bor i Stockholm',
  meaning: 'ett litet svenskt husdjur som jamar högt på nätterna och sover i soffan hela eftermiddagen',
  pos: 'substantiv',
  transliteration: 'kat',
  example: 'Katten sover på soffan.',
  example_translated: 'The cat is sleeping on the sofa.',
  explain: 'Katten är ett av de vanligaste husdjuren i Sverige, och den jamar gärna när den är hungrig.',
  forms: 'katt, katten, katter, katterna',
  synonym: 'kisse, kattdjur',
  antonym: 'hund',
  tag_1: 'djur', tag_2: 'husdjur', tag_3: '', tag_4: '',
  Tags: '',
  ID: '42',
  image: '',
  audio_word: '[sound:word.mp3]', audio_meaning: '[sound:meaning.mp3]', audio_example: '[sound:example.mp3]'
};

// Mini-mustache (same contract as tests/harness.js).
function render(tpl, data) {
  tpl = tpl.replace(/\{\{type:word\}\}/g, '<center><input type="text" id="typeans" value=""></center>');
  var prev;
  do {
    prev = tpl;
    tpl = tpl.replace(/\{\{#([^}]+)\}\}([\s\S]*?)\{\{\/\1\}\}/g, function (m, k, inner) {
      var v = data[k];
      return (v !== undefined && v !== null && v !== '') ? render(inner, data) : '';
    });
  } while (tpl !== prev);
  tpl = tpl.replace(/\{\{([^}]+)\}\}/g, function (m, k) {
    return (data[k] !== undefined ? String(data[k]) : '');
  });
  return tpl;
}

// In the preview, the templates' own <link>/<script src> tags must not run
// (the assets are inlined here and injected in the exact load order).
// Inline <script> bodies are kept and executed after the modules.
function splitTemplate(tpl) {
  var html = tpl
    .replace(/<link\s+[^>]*href="[^"]*"[^>]*>/g, '')
    .replace(/<script\s+src="[^"]*"[^>]*><\/script>/g, '');
  var inline = [];
  html = html.replace(/<script>([\s\S]*?)<\/script>/g, function (m, body) {
    inline.push(body);
    return '';
  });
  return { html: html, inline: inline };
}

var stage = document.getElementById('stage');
var lastMode = 'meaning-word';
var face = 'front';
var nightMode = false;
var SAMPLE_TYPED = 'en liten katt som heter Misa och bor i Stockholm';

var MOD_ORDER = ["storage","engine","diff","typing","aurora"];

// Preview-only emulation of Anki's [sound:] -> replay-button conversion, so
// audio fields show the real shipped icon instead of raw token text.
function toReplayButtons(html) {
  return html.replace(/\[sound:([^\]]+)\]/g, function (m, f) {
    return '<a class="replay-button soundLink" href="#" onclick="return false" aria-label="replay">[sound:' + f + ']</a>';
  });
}

function buildDoc() {
  var tpl = face === 'front' ? TPL_FRONT : TPL_BACK;
  var parts = splitTemplate(render(tpl, SAMPLE));
  parts.html = toReplayButtons(parts.html);
  var modsHtml = MOD_ORDER.map(function (name) {
    return '<script>' + HNA_MODS[name] + '<\/script>';
  }).join('\n');
  var pre = '<script>' +
    'window.__hnaTypedAnswerBuffer = ' + JSON.stringify(face === 'back' ? SAMPLE_TYPED : '') + ';' +
    'window.__hnaCardType = ' + JSON.stringify(lastMode) + ';' +
    '<\/script>';
  var nightClass = nightMode ? ' night-mode' : '';
  return '<!DOCTYPE html><html class="' + (nightMode ? 'night-mode' : '') + '"><head><meta charset="utf-8">' +
    // #qa is the preview-only stage wrapper: as a grid item it shrink-to-fit
    // past the viewport on narrow stages, pushing the whole card right (the
    // body clips the overflow, so it read as an off-centre card). Pin it to
    // the viewport; shipped CSS is untouched by this harness-only rule.
    '<style>' + HNA_CSS + ' #qa{max-width:100%;min-width:0} body.hna-preview #qa .sound a.replay-button.soundLink { color: transparent; font-size: 0; letter-spacing: 0; }</style></head><body class="hna-preview' + nightClass + '">' +
    '<div id="qa">' + parts.html + '</div>' + pre + modsHtml +
    '<script>' + parts.inline.join(';\n') + ';(function(){var input=document.getElementById("typeans");if(input)input.disabled=true;})();<\/script>' +
    '</body></html>';
}

function renderStage() {
  stage.srcdoc = buildDoc();
}

// The typing preview is a visual layout review surface for BOTH faces. Typing,
// settings, and review-state controls still belong to Anki, so the input is
// inert here; the back face renders with a sample typed buffer so the visual
// diff is visible. There is deliberately no shuffle control.

// ── Face / night-mode / width wiring (no shuffle) ──
document.getElementById('bFront').onclick = function () {
  face = 'front';
  this.classList.add('on');
  document.getElementById('bBack').classList.remove('on');
  renderStage();
};
document.getElementById('bBack').onclick = function () {
  face = 'back';
  this.classList.add('on');
  document.getElementById('bFront').classList.remove('on');
  renderStage();
};
document.getElementById('bNight').onclick = function () {
  nightMode = !nightMode;
  this.classList.toggle('on', nightMode);
  renderStage();
};

Array.prototype.forEach.call(document.querySelectorAll('[data-w]'), function (btn) {
  btn.addEventListener('click', function () {
    Array.prototype.forEach.call(document.querySelectorAll('[data-w]'), function (b) { b.classList.remove('on'); });
    btn.classList.add('on');
    var w = Number(btn.getAttribute('data-w'));
    stage.className = w ? 'w' + w : '';
  });
});

renderStage();
</script>
</body>
</html>
