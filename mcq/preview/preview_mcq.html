<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HNA MCQ — Preview</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1a2026; font-family: Segoe UI, Arial, sans-serif; }
  #toolbar { position: fixed; top: 0; left: 0; right: 0; z-index: 999; display: flex; flex-wrap: wrap;
             gap: 6px; align-items: center; padding: 8px 12px; background: #2a323b; color: #dfe6ec;
             border-bottom: 1px solid #000; font-size: 13px; }
  #toolbar .sep { width: 1px; height: 22px; background: #4a545e; margin: 0 6px; }
  #toolbar button { background: #3a4652; color: #e8eef4; border: 1px solid #55636f; border-radius: 4px;
                    padding: 4px 10px; font-size: 12px; cursor: pointer; }
  #toolbar button:hover { background: #46576a; }
  #toolbar button.on { background: #1e6f4c; border-color: #2f9d6e; }
  #stageWrap { position: fixed; top: 52px; left: 0; right: 0; bottom: 0; overflow: auto; padding: 16px; }
  #stage { display: block; margin: 0 auto; width: 100%; height: calc(100vh - 86px); border: 1px solid #3a4652;
           background: #fff; box-shadow: 0 4px 24px rgba(0,0,0,.5); }
  #stage.w375 { width: 375px; }
</style>
</head>
<body>

<div id="toolbar">
  <button id="bFront" class="on">Mặt Trước</button>
  <button id="bBack">Mặt Sau</button>
  <div class="sep"></div>
  <button id="bNight">Chế độ Tối (Dark Mode)</button>
  <div class="sep"></div>
  <button data-w="375">Mobile</button>
  <button data-w="0" class="on">Desktop (100%)</button>
  <div class="sep"></div>
  <button id="bReload">Xáo trộn lại (Shuffle New)</button>
</div>

<div id="stageWrap">
  <iframe id="stage" title="HNA MCQ preview"></iframe>
</div>

  "engine": "/* ============================================================\n   HNA MCQ ENGINE\n   Config, settings UI, keyboard shortcuts, audio feedback.\n   Reuses AnkiEngine namespace for full theme-pack compatibility.\n   ============================================================ */\n\nwindow.AnkiEngine = window.AnkiEngine || {};\nvar AnkiEngine = window.AnkiEngine;\n\nAnkiEngine.decodeHTML = function(html) {\n    var txt = AnkiEngine.__decoder;\n    if (!txt) { txt = AnkiEngine.__decoder = document.createElement(\"textarea\"); }\n    txt.innerHTML = html;\n    return txt.value;\n};\n\n// ── Default Config ──────────────────────────────────────────\nvar defaultConfig = {\n    nightMode:    false,\n    shuffleChoices: true,         // Randomize option order each review\n    playSound:    true,           // Web Audio chime on correct/wrong\n    auroraFlow:   true,           // Aurora ribbon animation\n    showExplain:  true,           // Show Explanation box on back\n    showTags:     true,\n    showStats:    false\n};\n\n// ── Menu Spec ─────────────────────────────────────────────────\nAnkiEngine.MENU_SPEC = [\n    { key: 'nightMode',      label: 'Chế độ tối',          shortcut: 'Alt+D', d: 'M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1-8.313-12.454z' },\n    { key: 'shuffleChoices', label: 'Xáo trộn đáp án',                        d: 'M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5' },\n    { key: 'playSound',      label: 'Hiệu ứng âm thanh',                      d: 'M11 5L6 9H2v6h4l5 4V5z m4 2a5 5 0 0 1 0 10m2.5-12.5a8.5 8.5 0 0 1 0 15' },\n    { key: 'auroraFlow',     label: 'Hiệu ứng Aurora',                        d: 'M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2' },\n    { key: 'showExplain',    label: 'Hiển thị giải thích', extra: true,       d: 'M12 20h.01M7 20h.01m10 0h.01M12 4v12m-4-4l4 4 4-4' },\n    { key: 'showTags',       label: 'Hiển thị nhãn',       extra: true,       d: 'M7 7h10v10H7z M7 7l5 5 5-5 M7 17l5-5 5 5' },\n    { key: 'showStats',      label: 'Hiển thị thống kê',   extra: true,       d: 'M3 3v18h18V3H3zm9 14a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2a3 3 0 1 0 0-6 3 3 0 0 0 0 6z' }\n];\n\n// ── Config Lifecycle ─────────────────────────────────────────\nfunction coerceConfigValue(v) {\n    if (typeof v === 'string') { var s = v.toLowerCase().trim(); return s === 'true' || s === '1'; }\n    if (typeof v === 'number') return v === 1;\n    return Boolean(v);\n}\n\nif (!AnkiEngine.config) {\n    AnkiEngine.config = {};\n    for (var _dk in defaultConfig) { AnkiEngine.config[_dk] = defaultConfig[_dk]; }\n} else {\n    for (var _dk2 in defaultConfig) {\n        if (!AnkiEngine.config.hasOwnProperty(_dk2)) AnkiEngine.config[_dk2] = defaultConfig[_dk2];\n    }\n}\n\nAnkiEngine.loadConfig = function() {\n    try {\n        var s = safeGet(STORAGE_KEYS.CONFIG);\n        if (s) {\n            var p = JSON.parse(s);\n            for (var k in p) {\n                if (defaultConfig.hasOwnProperty(k)) this.config[k] = coerceConfigValue(p[k]);\n            }\n        }\n    } catch(e) { console.warn(\"MCQ config load failed\", e); }\n};\n\nAnkiEngine.saveConfig = function() {\n    try { safeSet(STORAGE_KEYS.CONFIG, JSON.stringify(this.config)); } catch(e) {}\n};\n\nAnkiEngine.applyConfig = function() {\n    var c = this.config;\n    var toggleMap = [\n        ['night-mode',         c.nightMode],\n        ['pause-aurora-flow',  !c.auroraFlow],\n        ['hide-explain',       !c.showExplain],\n        ['hide-tags-card',     !c.showTags],\n        ['hide-stats',         !c.showStats]\n    ];\n    var self = this;\n    if (window.__mcqEngineRAF) cancelAnimationFrame(window.__mcqEngineRAF);\n    window.__mcqEngineRAF = requestAnimationFrame(function() {\n        window.__mcqEngineRAF = null;\n        var cl = document.documentElement.classList;\n        for (var i = 0; i < toggleMap.length; i++) {\n            cl.toggle(toggleMap[i][0], toggleMap[i][1]);\n        }\n        var body = document.body;\n        if (body) body.classList.toggle('night-mode', c.nightMode);\n        self.updateSwitches();\n    });\n};\n\nAnkiEngine.updateSwitches = function() {\n    for (var i = 0; i < this.MENU_SPEC.length; i++) {\n        var key = this.MENU_SPEC[i].key;\n        var el = document.getElementById('sw_' + key);\n        if (el) {\n            var on = Boolean(this.config[key]);\n            el.classList.toggle(\"checked\", on);\n            el.setAttribute('aria-checked', on ? 'true' : 'false');\n        }\n    }\n};\n\nAnkiEngine.toggleConfig = function(k) {\n    this.loadConfig();\n    this.config[k] = !this.config[k];\n    this.saveConfig();\n    this.applyConfig();\n};\n\n// ── Settings Menu ─────────────────────────────────────────────\nAnkiEngine.toggleSettings = function(e) {\n    if (e) e.stopPropagation();\n    this.buildSettingsMenu();\n    var btn = document.getElementById('btnSettings'), menu = document.getElementById('settingsMenu');\n    if (btn) {\n        btn.classList.toggle('active');\n        btn.setAttribute('aria-expanded', btn.classList.contains('active') ? 'true' : 'false');\n    }\n    if (menu) menu.classList.toggle('active');\n};\n\nAnkiEngine.closeSettings = function() {\n    var btn = document.getElementById('btnSettings'), menu = document.getElementById('settingsMenu');\n    if (btn) { btn.classList.remove('active'); btn.setAttribute('aria-expanded', 'false'); }\n    if (menu) menu.classList.remove('active');\n};\n\nAnkiEngine._buildMenuItem = function(spec) {\n    var item = document.createElement('div');\n    item.className = 'menu-item';\n    item.setAttribute('data-config', spec.key);\n\n    var label = document.createElement('span');\n    label.className = 'menu-label';\n    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');\n    svg.setAttribute('class', 'menu-icon');\n    svg.setAttribute('viewBox', '0 0 24 24');\n    var path = document.createElementNS('http://www.w ame = 'extras-content';\n            extras.appendChild(body);\n            frag.appendChild(extras);\n        }\n        extras.lastChild.appendChild(this._buildMenuItem(spec));\n    }\n    menu.appendChild(frag);\n    if (!menu.__mcqClickBound) {\n        menu.__mcqClickBound = true;\n        menu.addEventListener('click', function(e) { e.stopPropagation(); });\n    }\n    this.updateSwitches();\n    return true;\n};\n\n// ── Keyboard Shortcuts ──────────────────────────────────────\nAnkiEngine.setupEvents = function() {\n    if (AnkiEngine._keydownListener) {\n        document.removeEventListener(\"keydown\", AnkiEngine._keydownListener, true);\n    }\n    AnkiEngine._keydownListener = function(e) {\n        if (e.isComposing) return;\n        var k = e.key ? e.key.toLowerCase() : '';\n\n        // Alt+S: toggle settings menu\n        if (e.altKey && (k === 's' || e.code === 'KeyS')) {\n            AnkiEngine.toggleSettings(); e.preventDefault(); e.stopImmediatePropagation(); return;\n        }\n        // Alt+D: toggle dark mode\n        if (e.altKey && (k === 'd' || e.code === 'KeyD')) {\n            AnkiEngine.toggleConfig('nightMode'); e.preventDefault(); e.stopImmediatePropagation(); return;\n        }\n        // Escape: close settings menu\n        if (e.key === 'Escape') {\n            var sm = document.getElementById('settingsMenu');\n            if (sm && sm.classList.contains('active')) {\n                e.preventDefault(); e.stopImmediatePropagation();\n                AnkiEngine.closeSettings(); return;\n            }\n        }\n\n        // Digits 1-4 or letters a-d: pick an MCQ option. Keystrokes aimed\n        // at an editable field pass through untouched.\n        var tgt = e.target;\n        if (tgt && (tgt.tagName === 'INPUT' || tgt.tagName === 'TEXTAREA' || tgt.tagName === 'SELECT' || tgt.isContentEditable)) return;\n        var slotMap = { '1': 0, 'a': 0, '2': 1, 'b': 1, '3': 2, 'c': 2, '4': 3, 'd': 3 };\n        var slot = slotMap.hasOwnProperty(k) ? slotMap[k] : -1;\n        if (slot < 0) {\n            // Layout/IME-proof fallback: physical key positions.\n            var code = e.code || '';\n            var m = /^(?:Digit|Numpad)([1-4])$/.exec(code);\n            if (m) slot = parseInt(m[1], 10) - 1;\n            else {\n                var lm = /^Key([A-D])$/.exec(code);\n                if (lm) slot = lm[1].charCodeAt(0) - 65;\n            }\n        }\n        if (!e.altKey && !e.ctrlKey && !e.metaKey && slot >= 0) {\n            var btn = document.querySelector('.mcq-option-btn[data-slot=\"' + slot + '\"]');\n            if (btn && !btn.disabled) { btn.click(); e.preventDefault(); e.stopImmediatePropagation(); }\n        }\n    };\n    document.addEventListener(\"keydown\", AnkiEngine._keydownListener, true);\n\n    if (AnkiEngine._docClickListener) {\n        document.removeEventListener(\"click\", AnkiEngine._docClickListener);\n    }\n    AnkiEngine._docClickListener = function(e) {\n        var settingsMenu = document.getElementById(\"settingsMenu\"), btnSettings = document.getElementById(\"btnSettings\");\n        if (settingsMenu && settingsMenu.classList.contains(\"active\")) {\n            if (!settingsMenu.contains(e.target) && btnSettings && !btnSettings.contains(e.target)) {\n                AnkiEngine.closeSettings();\n            }\n        }\n    };\n    document.addEventListener(\"click\", AnkiEngine._docClickListener);\n};\n\nAnkiEngine.init = function() {\n    this.loadConfig();\n    this.applyConfig();\n    this.setupEvents();\n    var self = this;\n    if (window.__mcqEngineInitRAF) cancelAnimationFrame(window.__mcqEngineInitRAF);\n    window.__mcqEngineInitRAF = requestAnimationFrame(function() {\n        window.__mcqEngineInitRAF = null;\n        self.updateSwitches();\n    });\n};\n\nAnkiEngine.init();\n\n// ── Web Audio Feedback Synthesizer ───────────────────────────\n// Zero-asset: no external .mp3 files needed.\nwindow.AnkiAudio = window.AnkiAudio || {\n    ctx: null,\n    playTone: function(type) {\n        if (!AnkiEngine.config.playSound) return;\n        try {\n            if (!this.ctx || this.ctx.state === 'closed') {\n                this.ctx = new (window.AudioContext || window.webkitAudioContext)();\n            }\n            if (this.ctx.state === 'suspended') this.ctx.resume();\n            var osc = this.ctx.createOscillator(), gain = this.ctx.createGain();\n            osc.connect(gain); gain.connect(this.ctx.destination);\n            var t = this.ctx.currentTime;\n            if (type === 'correct') {\n                osc.type = 'sine';\n                osc.frequency.setValueAtTime(587.33, t);          // E5\n                osc.frequency.exponentialRampToValueAtTime(880, t + 0.15); // A5\n                gain.gain.setValueAtTime(0.12, t);\n                gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);\n                osc.start(); osc.stop(t + 0.35);\n            } else {\n                osc.type = 'square';\n                osc.frequency.setValueAtTime(180, t);\n                osc.frequency.exponentialRampToValueAtTime(130, t + 0.25);\n                gain.gain.setValueAtTime(0.08, t);\n                gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);\n                osc.start(); osc.stop(t + 0.25);\n            }\n            osc.onended = function() { try { osc.disconnect(); gain.disconnect(); } catch(_e) {} };\n        } catch(_e) {}\n    }\n};\n",
  "logic": "/* ============================================================\n   HNA MCQ LOGIC MODULE\n   Handles Fisher-Yates shuffle, State management (Front -> Back),\n   and Anki Flip bridge for the MCQ Note Type.\n   ============================================================ */\n\nwindow.AnkiMCQ = window.AnkiMCQ || {};\n\n(function() {\n    var AnkiMCQ = window.AnkiMCQ;\n    \n    // Note fields are untrusted content. Extract rendered text; never carry\n    // field HTML into a dynamic sink.\n    AnkiMCQ.getRawChoicesFromDOM = function() {\n        var elements = document.querySelectorAll('.mcq-raw-ans');\n        var choices = [];\n        for (var i = 0; i < elements.length; i++) {\n            var el = elements[i];\n            var text = (el.textContent || el.innerText || '').replace(/^\\s+|\\s+$/g, '');\n            if (text.length > 0 && text.indexOf('{{') === -1) {\n                choices.push({ text: text, isCorrect: el.getAttribute('data-correct') === 'true' });\n            }\n        }\n        return choices;\n    };\n\n    AnkiMCQ.destroyFront = function() {\n        if (window.__hnaMCQKeydown) {\n            document.removeEventListener('keydown', window.__hnaMCQKeydown, true);\n            window.__hnaMCQKeydown = null;\n        }\n    };\n\n    // Standard Fisher-Yates Shuffle (ES5 compatible)\n    AnkiMCQ.shuffleChoices = function(rawChoices) {\n        var items = rawChoices.slice();\n        for (var j = items.length - 1; j > 0; j--) {\n            var randIdx = Math.floor(Math.random() * (j + 1));\n            var temp = items[j];\n            items[j] = items[randIdx];\n            items[randIdx] = temp;\n        }\n        return items;\n    };\n\n    // Full rendered text prevents collisions between cards sharing a prefix.\n    AnkiMCQ.getCardSignature = function() {\n        var nodes = document.querySelectorAll('.mcq-raw-ans, #mcq-question-raw');\n        var out = [];\n        for (var i = 0; i < nodes.length; i++) out.push(nodes[i].textContent || nodes[i].innerText || '');\n        return out.join('\\u001f');\n    };\n\n    AnkiMCQ.clearState = function() {\n        window.__hnaMCQState = null;\n        try { sessionStorage.removeItem('hna-mcq-state'); } catch(e) {}\n    };\n\n    AnkiMCQ.isValidState = function(state, choices) {\n        return !!(state && state.sig === AnkiMCQ.getCardSignature() &&\n            state.expiresAt > Date.now() && Array.isArray(state.shuffledOrder) &&\n            typeof state.chosenIndex === 'number' && state.chosenIndex >= 0 &&\n            state.chosenIndex < state.shuffledOrder.length &&\n            state.shuffledOrder.length === choices.length);\n    };\n\n    // Save state once, then trigger Anki's flip.\n    AnkiMCQ.selectAndFlip = function(chosenIndex, shuffledOrder) {\n        var state;\n        if (window.__hnaMCQAnswered) return;\n        if (typeof chosenIndex !== 'number' || chosenIndex < 0 || chosenIndex >= shuffledOrder.length) return;\n        window.__hnaMCQAnswered = true;\n        state = {\n            sig: AnkiMCQ.getCardSignature(),\n            shuffledOrder: shuffledOrder,\n            chosenIndex: chosenIndex,\n            expiresAt: Date.now() + 300000\n        };\n        \n        window.__hnaMCQState = state;\n        try { sessionStorage.setItem('hna-mcq-state', JSON.stringify(state)); } catch(e) {}\n\n        // Visual feedback before flip\n        var btns = document.querySelectorAll('.mcq-option-btn');\n        if (btns[chosenIndex]) {\n            btns[chosenIndex].classList.add('is-pressed');\n        }\n\n        // Anki Flip Bridge with micro-delay for UX\n        setTimeout(function() {\n            if (typeof pycmd !== 'undefined') {\n                pycmd(\"ans\");\n            } else if (typeof showAnswer !== 'undefined') {\n                showAnswer();\n            } else if (window.location && window.location.href) {\n                window.location.href = \"anki://flip\";\n            }\n        }, 80);\n    };\n\n    // Progressive-enhancement marker. Adding html.mcq-ready flips the CSS\n    // backdoor off once the interactive grid is live. Only called after a\n    // successful render (initFront/initBack below); if any build step threw\n    // — or the script never ran at all — the marker stays absent and the\n    // static raw answer divs remain readable, so a card is never left with\n    // zero options.\n    AnkiMCQ.markReady = function() {\n        try {\n            if (document.documentElement && document.documentElement.classList) {\n                document.documentElement.classList.add('mcq-ready');\n            }\n        } catch (e) {}\n    };\n\n    // Render Logic for Front Face\n    AnkiMCQ.initFront = function() {\n        var container = document.getElementById('mcq-options-container');\n        AnkiMCQ.destroyFront();\n        window.__hnaMCQAnswered = false;\n        // A freshly shown question carries no answer: drop any stored\n        // selection, or a same-tab refresh/undo resurrects the last verdict\n        // from sessionStorage on the next flip.\n        AnkiMCQ.clearState();\n        if (!container) return;\n\n        var rawChoices = AnkiMCQ.getRawChoicesFromDOM();\n        if (rawChoices.length === 0) return;\n\n        // Check config whether to shuffle or preserve order\n        var shouldShuffle = true;\n        if (window.AnkiEngine && window.AnkiEngine.config && window.AnkiEngine.config.shuffleChoices === false) {\n            shouldShuffle = false;\n        }\n\n        var list = shouldShuffle ? AnkiMCQ.shuffleChoices(rawChoices) : rawChoices;\n        container.innerHTML = '';\n        \n        var alphabet = ['A', 'B', 'C', 'D'];\n        for (var i = 0; i < list.length; i++) {\n            var btn = document.createElement('button');\n            btn.className = 'mcq-option-btn glass-pseudo';\n            btn.type = 'button';\n            btn.setAttribute('data-slot', i);\n            var badge = document.createElement('div');\n            var content = document.createElement('div');\n            var shortcut = document.createElement('div');\n            badge.className = 'option-badge';\n            content.className = 'option-content';\n            shortcut.className = 'option-shortcut';\n            badge.textContent = alphabet[i] || (i + 1);\n            content.textContent = list[i].text;\n            shortcut.textContent = '[' + (i + 1) + ']';\n            btn.appendChild(badge);\n            btn.appendChild(content);\n            btn.appendChild(shortcut);\n            \n            (function(idx, currentList) {\n                btn.onclick = function() { AnkiMCQ.selectAndFlip(idx, currentList); };\n            })(i, list);\n            \n            container.appendChild(btn);\n        }\n\n        AnkiMCQ.markReady();\n\n        // Keyboard navigation\n        if (window.__hnaMCQKeydown) {\n            document.removeEventListener('keydown', window.__hnaMCQKeydown, true);\n        }\n        window.__hnaMCQKeydown = function(e) {\n            if (e.isComposing) return;\n            // Never hijack browser/Anki chords or keystrokes aimed at an\n            // editable field — plain 1-4/a-d on the card body only.\n            if (e.ctrlKey || e.metaKey || e.altKey) return;\n            var tgt = e.target;\n            if (tgt && (tgt.tagName === 'INPUT' || tgt.tagName === 'TEXTAREA' || tgt.tagName === 'SELECT' || tgt.isContentEditable)) return;\n            var key = e.key;\n            var kl = (key || '').toLowerCase();\n            if (key >= '1' && key <= list.length.toString()) {\n                AnkiMCQ.selectAndFlip(parseInt(key) - 1, list);\n                e.preventDefault();\n                e.stopPropagation();\n            } else if (['a', 'b', 'c', 'd'].indexOf(kl) !== -1) {\n                var idx = ['a', 'b', 'c', 'd'].indexOf(kl);\n                if (idx < list.length) {\n                    AnkiMCQ.selectAndFlip(idx, list);\n                    e.preventDefault();\n                    e.stopPropagation();\n                }\n            } else {\n                // Layout/IME-proof fallback: physical key positions, same\n                // house pattern as the engine's Alt+S/Alt+D shortcuts.\n                var code = e.code || '';\n                var m = /^(?:Digit|Numpad)([1-4])$/.exec(code);\n                var cidx = -1;\n                if (m) {\n                    cidx = parseInt(m[1], 10) - 1;\n                } else {\n                    var lm = /^Key([A-D])$/.exec(code);\n                    if (lm) cidx = lm[1].charCodeAt(0) - 65;\n                }\n                if (cidx >= 0 && cidx < list.length) {\n                    AnkiMCQ.selectAndFlip(cidx, list);\n                    e.preventDefault();\n                    e.stopPropagation();\n                }\n            }\n        };\n        document.addEventListener('keydown', window.__hnaMCQKeydown, true);\n\n        AnkiMCQ.scheduleFit();\n    };\n\n    // Render Logic for Back Face\n    AnkiMCQ.initBack = function() {\n        var container = document.getElementById('mcq-options-container');\n        var verdict = document.getElementById('mcq-verdict-container');\n        if (verdict) {\n            verdict.setAttribute('role', 'status');\n            verdict.setAttribute('aria-live', 'polite');\n        }\n        if (!container) return;\n\n        var rawChoices = AnkiMCQ.getRawChoicesFromDOM();\n\n        // Try to recover state\n        var state = window.__hnaMCQState;\n        if (!state) {\n            try { state = JSON.parse(sessionStorage.getItem('hna-mcq-state')); } catch(e) {}\n        }\n\n        var sig = AnkiMCQ.getCardSignature();\n        if (state && AnkiMCQ.isValidState(state, rawChoices)) {\n            // State is valid: use stored shuffle and index\n            var shuffled = state.shuffledOrder;\n            var chosenIndex = state.chosenIndex;\n        } else {\n            // Invalid or missing state: clear and fallback to raw order\   "aurora": "/* ============================================================\n   HNA AURORA SINGLETON\n   Keeps the blurred aurora-bg layer alive once per REVIEW SESSION instead\n   of letting Anki's per-card #qa innerHTML swap destroy and rebuild it\n   (and its filter:blur() compositing layer) on every flip. This is what\n   was accumulating RAM even with Perf Mode / Aurora Flow toggled off —\n   those only hid or paused the layer, they didn't stop it from being\n   recreated. This file removes the recreation entirely.\n   Dependencies: none. Safe to load in any order relative to the other\n   _hna_* scripts; it doesn't touch AnkiEngine or the typing/diff modules.\n   ============================================================ */\n\n(function () {\n    function ensureHost() {\n        var host = document.getElementById('hna-aurora-host');\n        if (host) return host;\n\n        host = document.createElement('div');\n        host.id = 'hna-aurora-host';\n        host.className = 'hna-aurora-host';\n        // Session-lifetime markup: the two blurred ribbon layers. This host\n        // is created ONCE and never re-innerHTML'd, so the mid layer costs\n        // one fixed rasterization (same class of cost as the base ribbon),\n        // not a per-flip one.\n        host.innerHTML = '<div class=\"aurora-bg\"></div><div class=\"aurora-bg aurora-bg--mid\"></div>';\n\n        // Insert as <body>'s very first child, once, for the whole\n        // session. Never removed, never recreated from here on.\n        document.body.insertBefore(host, document.body.firstChild);\n        return host;\n    }\n\n    function syncAurora() {\n        var host = ensureHost();\n\n        // Host mirrors the card box exactly at every breakpoint (the old\n        // <=768 fullscreen !important override is gone so the static\n        // body::before backdrop can show around the card). The aurora\n        // layers inside are proportional (%-based insets/travel), so the\n        // animation scales to whatever size the card is.\n        var card = document.querySelector('.aurora-card');\n        if (!card) {\n            // Don't hide the host on transient no-card states (flip gap).\n            // The host stays at its last known position and opacity; the\n            // next sync (animationend / MutationObserver) will re-position it.\n            return;\n        }\n        var rect = card.getBoundingClientRect();\n        if (rect.width === 0 || rect.height === 0) return; // not laid out yet, retry next pass\n\n        // The host is position:absolute (so it scrolls with the card and\n        // stays aligned with the in-flow glass-pseudo layers on mobile/\n        // tablet where the back card is taller than the viewport), so it\n        // needs DOCUMENT coordinates, not the viewport-relative rect.\n        // body is position:relative, so it is the host's containing block —\n        // and body is the real scroll container on phones (html, body get\n        // height:100% + overflow-y:auto). Content coordinates = viewport\n        // rect minus body's own rect, plus body's internal scroll offset.\n        // This stays correct whether the window scrolls (bodyRect shifts,\n        // body scroll* = 0) or body alone scrolls (bodyRect is fixed,\n        // scroll* grows). Since the host lives inside body, it travels with\n        // the card automatically — no scroll listener is needed, so the RAM\n        // audit's listener budget is untouched.\n        var body = document.body;\n        var br = body ? (body.getBoundingClientRect ? body.getBoundingClientRect() : null) : null;\n        var ox = br ? br.left : 0;\n        var oy = br ? br.top : 0;\n        var sx = body ? (body.scrollLeft || 0) : 0;\n        var sy = body ? (body.scrollTop || 0) : 0;\n        host.style.left = (rect.left - ox + sx) + 'px';\n        host.style.top = (rect.top - oy + sy) + 'px';\n        host.style.width = rect.width + 'px';\n        host.style.height = rect.height + 'px';\n\n        var radius = getComputedStyle(card).borderRadius;\n        if (radius) host.style.borderRadius = radius;\n\n        host.classList.add('hna-aurora-visible');\n    }\n\n    function scheduleSync() {\n        // One-shot double-rAF (RAM audit rule): cancel a pending sync before\n        // re-scheduling so a resize/flip storm cannot pile up chained frames;\n        // the handle is cleared once the second frame has run.\n        if (window.__hnaAuroraSync) cancelAnimationFrame(window.__hnaAuroraSync);\n        window.__hnaAuroraSync = requestAnimationFrame(function () {\n            syncAurora();\n            // Fonts/images can still reflow the card after first paint\n            // (word-wrap, image decode) — re-measure one more frame later\n            // so the halo doesn't sit at a stale size/position.\n            window.__hnaAuroraSync = requestAnimationFrame(function () {\n                window.__hnaAuroraSync = null;\n                syncAurora();\n            });\n        });\n    }\n\n    scheduleSync();\n\n    // All four re-sync paths run at every breakpoint now: the host is\n    // card-sized everywhere, so it must re-measure after each flip, resize,\n    // and card reflow (details open, image load) on phones/tablets too.\n\n    // NOTE: the listener is on document, not on a specific .aurora-card.\n    //    Per-card listeners (the previous approach) were attached once at\n    //    load time to the first card seen — they died with that card and\n    //    never fired for subsequent flips, so the re-sync below only ran\n    //    on card 1. document-level capture catches every flip.\n    //\n    //    A MutationObserver on #qa is also present because Anki's\n    //    innerHTML swap can abort the appearing animation mid-flight\n    //    (e.g. on very fast flips), leaving animationend un-fired and\n    //    the aurora host still sized to the old card. The observer\n    //    catches the swap itself, not the animation ending.\n    var qaEl = document.getElementById('qa');\n    if (qaEl && typeof MutationObserver !== 'undefined') {\n        var __hnaAuroraMO = window.__hnaAuroraMO;\n        if (!__hnaAuroraMO) {\n            __hnaAuroraMO = window.__hnaAuroraMO = new MutationObserver(function (records) {\n                // Filter to the card swap itself. This observer sits on #qa with\n                // subtree:true, so WITHOUT the filter it also fires on every\n                // childList mutation deeper inside the card — the typing\n                // overlay's extra-span insert/remove and the Back-face diff-row\n                // rebuild being the per-keystroke ones. Each batch then ran two\n                // rAFs doing getBoundingClientRect + getComputedStyle, i.e. the\n                // aurora was doing forced layout work on every over-typed char.\n                // Anki's flip replaces #qa's children directly, so every swap\n                // record has target === qaEl (or adds an .aurora-card subtree).\n                for (var i = 0; i < records.length; i++) {\n                    if (records[i].target === qaEl) { scheduleSync(); return; }\n                    var added = records[i].addedNodes;\n                    for (var j = 0; j < added.length; j++) {\n                        var n = added[j];\n                        if (n.classList && n.classList.contains('aurora-card')) { scheduleSync(); return; }\n                    }\n                }\n            });\n        }\n        __hnaAuroraMO.observe(qaEl, { childList: true, subtree: true });\n    }\n    if (!window.__hnaAuroraAnimEndBound) {\n        window.__hnaAuroraAnimEndBound = true;\n        document.addEventListener('animationend', function (e) {\n            if (!e.target.classList.contains('aurora-card')) return;\n            // Single-tier: hna-card-appear is the only card-appear animation\n            // name (the uq-card-appear branch was removed with the tier split).\n            if (e.animationName === 'hna- function render(tpl, data) {
  var prev;
  do {
    prev = tpl;
    tpl = tpl.replace(/\{\{#([^}]+)\}\}([\s\S]*?)\{\{\/\1\}\}/g, function (m, k, inner) {
      var v = data[k];
      return (v !== undefined && v !== null && v !== '') ? render(inner, data) : '';
    });
  } while (tpl !== prev);
  tpl = tpl.replace(/\{\{([^}]+)\}\}/g, function (m, k) {
    return (data[k] !== undefined ? String(data[k]) : '');
  });
  return tpl;
}

function splitTemplate(tpl) {
  var html = tpl
    .replace(/<link\s+[^>]*href="[^"]*"[^>]*>/g, '')
    .replace(/<script\s+src="[^"]*"[^>]*><\/script>/g, '');
  var inline = [];
  html = html.replace(/<script>([\s\S]*?)<\/script>/g, function (m, body) {
    inline.push(body);
    return '';
  });
  return { html: html, inline: inline };
}

var stage = document.getElementById('stage');
var face = 'front';
var MOD_ORDER = ["storage","engine","logic","aurora"];
var nightModeOverride = false;

// Preview-only emulation of Anki's [sound:] -> replay-button conversion, so
// audio fields show the real shipped icon instead of raw token text.
function toReplayButtons(html) {
  return html.replace(/\[sound:([^\]]+)\]/g, function (m, f) {
    return '<a class="replay-button soundLink" href="#" onclick="return false" aria-label="replay">[sound:' + f + ']</a>';
  });
}

function buildDoc() {
  var tpl = face === 'front' ? TPL_FRONT : TPL_BACK;
  var parts = splitTemplate(render(tpl, SAMPLE));
  parts.html = toReplayButtons(parts.html);
  var modsHtml = MOD_ORDER.map(function (name) {
    return '<script>' + HNA_MODS[name] + '<\/script>';
  }).join('\n');
  
  var mockAnkiFlip = '<script>window.pycmd = function(arg) { if(arg==="ans") window.parent.postMessage("flip", "*"); };<\/script>';
  
  return '<!DOCTYPE html><html class="' + (nightModeOverride ? 'night-mode' : '') + '"><head><meta charset="utf-8">' +
    '<style>' + HNA_CSS + ' #qa .sound a.replay-button.soundLink { color: transparent; font-size: 0; }</style></head><body ' + (nightModeOverride ? 'class="night-mode"' : '') + '>' +
    '<div id="qa">' + parts.html + '</div>' + mockAnkiFlip + modsHtml +
    '<script>' + parts.inline.join(';\n') + '<\/script>' +
    '</body></html>';
}

function renderStage() {
  stage.srcdoc = buildDoc();
}

window.addEventListener('message', function(e) {
  if (e.data === 'flip') {
    face = 'back';
    document.getElementById('bFront').classList.remove('on');
    document.getElementById('bBack').classList.add('on');
    renderStage();
  }
});

// Keyboard forwarding: the card lives in an iframe, so plain 1-4/a-d pressed
// while the outer toolbar holds focus would never reach it. Mirror those keys
// into the stage on the FRONT face only — the back must ignore shortcuts by
// contract, and the in-card handler still owns selection + flip.
document.addEventListener('keydown', function (e) {
  if (face !== 'front') return;
  if (e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
  var t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  var k = e.key || '';
  var ok = (k >= '1' && k <= '4') ||
    ['a', 'b', 'c', 'd', 'A', 'B', 'C', 'D'].indexOf(k) !== -1;
  if (!ok) return;
  try {
    var doc = stage.contentDocument;
    if (!doc) return;
    var evt = new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true });
    doc.dispatchEvent(evt);
    e.preventDefault();
  } catch (err) {}
});

document.getElementById('bFront').onclick = function() { face = 'front'; this.classList.add('on'); document.getElementById('bBack').classList.remove('on'); renderStage(); };
document.getElementById('bBack').onclick = function() { face = 'back'; this.classList.add('on'); document.getElementById('bFront').classList.remove('on'); renderStage(); };
document.getElementById('bNight').onclick = function() {
  nightModeOverride = !nightModeOverride;
  this.classList.toggle('on', nightModeOverride);
  renderStage();
};
document.getElementById('bReload').onclick = function() { renderStage(); };

document.querySelectorAll('button[data-w]').forEach(btn => {
  btn.onclick = function() {
    document.querySelectorAll('button[data-w]').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    let v = parseInt(btn.getAttribute('data-w'));
    stage.className = v === 0 ? '' : 'w' + v;
  };
});

renderStage();
</script>
</body>
