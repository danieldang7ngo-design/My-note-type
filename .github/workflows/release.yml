name: Release gate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run preview:build
      - run: node mcq/preview/build-preview.js
      - run: npm run test:all
      - run: npm run release:check
